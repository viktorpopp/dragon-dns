[package]
name = "dragon-dns"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
cloudflare = { git = "https://github.com/viktorpopp/cloudflare-rs.git" }
color-eyre = "0.6.5"
croner = { version = "4.0.0", features = ["serde"] }
dotenvy = "0.15.7"
envy = "0.4.2"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
